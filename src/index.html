<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#130a0e">
<title>Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #0d0608;
  --line:  #2a1018;
  --pink:  #ff2d87;
  --grad:  linear-gradient(135deg, #ff2d87 0%, #ff7a30 55%, #ffb800 100%);
  --danger:#ff5c5c;
  --success:#3ddc84;
  --text:  #fdf0f5;
  --muted: #7a5060;
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; font-family:'Syne',sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }

/* SCREENS */
.screen { position:fixed; inset:0; display:flex; flex-direction:column; transition:opacity 0.2s, transform 0.2s; }
.screen.hidden { opacity:0; pointer-events:none; transform:translateY(10px); }

/* LOCK SCREEN */
#screen-lock {
  align-items:center; justify-content:center; overflow-y:auto;
  padding:2rem 1.5rem;
  padding-top:calc(2rem + var(--safe-top));
  padding-bottom:calc(2rem + var(--safe-bot));
}
.lock-card { width:100%; max-width:380px; }
.lock-icon-img { width:72px; height:72px; display:block; margin:0 auto 1.2rem; }
.lock-title {
  font-size:2.2rem; font-weight:800; text-align:center; letter-spacing:-1.5px;
  background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:0.2rem;
}
.lock-sub { text-align:center; font-family:'Space Mono',monospace; font-size:0.7rem; color:var(--muted); margin-bottom:2rem; letter-spacing:1px; }

.tabs { display:flex; gap:6px; margin-bottom:1.5rem; }
.tab-btn {
  flex:1; padding:0.6rem; border-radius:10px;
  border:1px solid var(--line); background:transparent;
  color:var(--muted); font-family:'Syne',sans-serif; font-weight:700; font-size:0.85rem; cursor:pointer;
}
.tab-btn.active { background:var(--grad); border-color:transparent; color:#fff; }

.field-label { font-family:'Space Mono',monospace; font-size:0.67rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; display:block; margin-bottom:0.45rem; }

input[type="password"], input[type="text"], textarea {
  width:100%; background:transparent; border:none; border-bottom:1px solid var(--line);
  border-radius:0; color:var(--text); font-family:'Space Mono',monospace;
  font-size:0.9rem; padding:0.7rem 0; outline:none; margin-bottom:1.2rem;
  -webkit-appearance:none; appearance:none;
}
input:focus, textarea:focus { border-bottom-color:var(--pink); }

.btn-primary {
  width:100%; padding:0.9rem; border-radius:12px; border:none;
  background:var(--grad); color:#fff;
  font-family:'Syne',sans-serif; font-weight:800; font-size:1rem; cursor:pointer;
  transition:transform 0.1s;
}
.btn-primary:active { transform:scale(0.98); }

.error-msg {
  background:transparent; border:none; border-left:2px solid var(--danger);
  color:var(--danger); font-family:'Space Mono',monospace; font-size:0.77rem;
  padding:0.4rem 0.7rem; margin-bottom:1rem; display:none;
}

/* LIST SCREEN */
#screen-list { background:var(--bg); }

.app-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:0.85rem 1.25rem;
  padding-top:calc(0.85rem + var(--safe-top));
  border-bottom:1px solid var(--line); flex-shrink:0;
}
.app-logo {
  font-size:1.3rem; font-weight:800; letter-spacing:-1px;
  background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.header-right { display:flex; align-items:center; gap:0.6rem; }

.enc-pill {
  font-family:'Space Mono',monospace; font-size:0.63rem; color:var(--success);
  border:1px solid var(--line); border-radius:20px; padding:0.22rem 0.65rem;
  display:flex; align-items:center; gap:0.35rem;
}
.enc-dot { width:5px; height:5px; border-radius:50%; background:var(--success); animation:pulse 2s infinite; }

.lock-btn {
  background:transparent; border:1px solid var(--line);
  border-radius:8px; padding:0.38rem 0.7rem; color:var(--muted);
  font-family:'Space Mono',monospace; font-size:0.72rem; cursor:pointer;
}
.lock-btn:active { border-color:var(--pink); color:var(--pink); }

.notes-scroll { flex:1; overflow-y:auto; padding:0.75rem 1rem; }
.notes-scroll::-webkit-scrollbar { display:none; }

.empty-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:0.6rem; padding:4rem 2rem; color:var(--muted);
  font-family:'Space Mono',monospace; font-size:0.8rem; text-align:center; line-height:1.65;
}
.empty-state .eicon { font-size:2.5rem; opacity:0.2; }

.note-card {
  border-bottom:1px solid var(--line); padding:0.9rem 0; cursor:pointer; transition:opacity 0.1s;
}
.note-card:active { opacity:0.6; }
.note-card-title { font-size:0.95rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:0.25rem; }
.note-card-preview { font-family:'Space Mono',monospace; font-size:0.71rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:0.4rem; }
.note-card-meta { display:flex; justify-content:space-between; align-items:center; }
.note-card-date { font-family:'Space Mono',monospace; font-size:0.64rem; color:var(--muted); }
.enc-tag { font-family:'Space Mono',monospace; font-size:0.59rem; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:1px 5px; }

/* EDITOR SCREEN */
#screen-editor { background:var(--bg); }

.editor-header {
  display:flex; align-items:center; gap:0.6rem;
  padding:0.75rem 1rem;
  padding-top:calc(0.75rem + var(--safe-top));
  border-bottom:1px solid var(--line); flex-shrink:0;
}
.back-btn {
  background:transparent; border:none; color:var(--muted);
  font-size:1.3rem; cursor:pointer; padding:0 0.3rem; line-height:1;
}
.back-btn:active { color:var(--text); }
.editor-title-wrap { flex:1; min-width:0; }
#note-title {
  border-bottom:none; padding:0; margin-bottom:0;
  font-family:'Syne',sans-serif; font-size:1rem; font-weight:800;
}
#note-title:focus { border-bottom:none; }
.editor-del-btn {
  background:transparent; border:none; color:var(--muted);
  font-size:1rem; cursor:pointer; padding:0 0.3rem;
}
.editor-del-btn:active { color:var(--danger); }
.editor-save-btn {
  background:var(--grad); border:none; border-radius:9px;
  padding:0.45rem 1rem; color:#fff;
  font-family:'Syne',sans-serif; font-weight:800; font-size:0.85rem; cursor:pointer;
  transition:transform 0.1s;
}
.editor-save-btn:active { transform:scale(0.96); }

.editor-body { flex:1; overflow-y:auto; padding:1rem 1.1rem; padding-bottom:calc(1rem + var(--safe-bot)); }
.editor-body::-webkit-scrollbar { display:none; }
#note-content {
  width:100%; min-height:calc(100dvh - 120px);
  background:transparent; border:none; color:var(--text);
  font-family:'Space Mono',monospace; font-size:0.88rem; line-height:1.9;
  resize:none; outline:none; padding:0; margin-bottom:0;
}
#note-content:focus { border:none; }

/* TOAST */
.toast {
  position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(14px);
  background:var(--bg); border:1px solid var(--line);
  border-radius:20px; padding:0.55rem 1.1rem;
  font-family:'Space Mono',monospace; font-size:0.77rem; color:var(--text);
  z-index:9999; opacity:0; transition:all 0.28s cubic-bezier(0.34,1.56,0.64,1);
  white-space:nowrap; pointer-events:none;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>

<div class="screen hidden" id="screen-list">
  <div class="app-header">

      <div class="enc-pill"><div class="enc-dot"></div>AES-256</div>
      <button class="lock-btn" onclick="newNote()">＋ New</button>
      <button class="lock-btn" onclick="lockVault()">🔒 Lock</button>
    </div>
  </div>

  <div class="notes-scroll" id="notes-list">
    <div class="empty-state">
      <div class="eicon">📝</div>
      No notes yet.<br>Tap + to create your first encrypted note.
    </div>
  </div>

</div>

<!-- ══ EDITOR SCREEN ══ -->
<div class="screen hidden" id="screen-editor">
  <div class="editor-header">
    <button class="back-btn" onclick="goBack()">←</button>
    <div class="editor-title-wrap">
      <input type="text" id="note-title" placeholder="Note title…" autocomplete="off" spellcheck="true">
    </div>
    <button class="editor-del-btn" onclick="deleteNote()">🗑</button>
    <button class="editor-save-btn" onclick="saveNote()">Save</button>
  </div>
  <div class="editor-body">
    <textarea id="note-content" placeholder="Start writing… everything is encrypted with AES-256-GCM." spellcheck="true"></textarea>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════
//  CRYPTO — AES-256-GCM + PBKDF2
// ══════════════════════════════════════
const VAULT_KEY  = 'vault_notes_v1';
const SALT_KEY   = 'vault_salt_v1';
const VERIFY_KEY = 'vault_verify_v1';

let masterKey = null, notes = {}, currentNoteId = null;

async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:310000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
async function aesEnc(key, text) {
  const iv  = crypto.getRandomValues(new Uint8Array(12));
  const buf = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(text));
  const out = new Uint8Array(12 + buf.byteLength);
  out.set(iv); out.set(new Uint8Array(buf), 12);
  return btoa(String.fromCharCode(...out));
}
async function aesDec(key, b64) {
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:raw.slice(0,12) }, key, raw.slice(12));
  return new TextDecoder().decode(buf);
}

// ══════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s =>
    s.classList.toggle('hidden', s.id !== id)
  );
}

// ══════════════════════════════════════
//  LOCK / UNLOCK
// ══════════════════════════════════════
function switchTab(tab) {
  document.getElementById('tab-btn-unlock').classList.toggle('active', tab==='unlock');
  document.getElementById('tab-btn-new').classList.toggle('active', tab==='new');
  document.getElementById('tab-unlock').style.display = tab==='unlock' ? '' : 'none';
  document.getElementById('tab-new').style.display    = tab==='new'    ? '' : 'none';
}

async function createVault() {
  const p1 = document.getElementById('new-password').value;
  const p2 = document.getElementById('new-password2').value;
  const err = document.getElementById('new-error');
  if (!p1)       { showErr(err,'Password cannot be empty.'); return; }
  if (p1 !== p2) { showErr(err,'Passwords do not match.'); return; }
  if (p1.length < 8){ showErr(err,'Use at least 8 characters.'); return; }
  err.style.display = 'none';
  const salt = crypto.getRandomValues(new Uint8Array(32));
  localStorage.setItem(SALT_KEY, btoa(String.fromCharCode(...salt)));
  masterKey = await deriveKey(p1, salt);
  localStorage.setItem(VERIFY_KEY, await aesEnc(masterKey, '__VAULT_OK__'));
  localStorage.setItem(VAULT_KEY,  await aesEnc(masterKey, JSON.stringify({})));
  notes = {};
  openApp();
}

async function unlockVault() {
  const pw  = document.getElementById('unlock-password').value;
  const err = document.getElementById('unlock-error');
  const s64 = localStorage.getItem(SALT_KEY);
  const v64 = localStorage.getItem(VERIFY_KEY);
  if (!s64||!v64){ showErr(err,'No vault found. Create one first.'); return; }
  if (!pw)        { showErr(err,'Enter your password.'); return; }
  err.style.display = 'none';
  const salt = Uint8Array.from(atob(s64), c=>c.charCodeAt(0));
  try {
    const key = await deriveKey(pw, salt);
    if (await aesDec(key, v64) !== '__VAULT_OK__') throw 0;
    masterKey = key;
    const raw = localStorage.getItem(VAULT_KEY);
    notes = raw ? JSON.parse(await aesDec(masterKey, raw)) : {};
    openApp();
  } catch {
    showErr(err,'🚫 Wrong password — decryption failed.');
    masterKey = null;
  }
}

function lockVault() {
  masterKey = null; notes = {}; currentNoteId = null;
  document.getElementById('unlock-password').value = '';
  document.getElementById('unlock-error').style.display = 'none';
  // Vault always exists at this point, just show unlock with no tabs
  document.getElementById('tab-unlock').style.display = '';
  document.getElementById('tab-new').style.display = 'none';
  document.getElementById('tabs-row').style.display = 'none';
  showScreen('screen-lock');
}

function openApp() { renderNotesList(); showScreen('screen-list'); }

// ══════════════════════════════════════
//  NOTES
// ══════════════════════════════════════
async function persist() {
  localStorage.setItem(VAULT_KEY, await aesEnc(masterKey, JSON.stringify(notes)));
}
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function renderNotesList() {
  const el  = document.getElementById('notes-list');
  const ids = Object.keys(notes).sort((a,b)=>(notes[b].updatedAt||0)-(notes[a].updatedAt||0));
  if (!ids.length) {
    el.innerHTML = `<div class="empty-state"><div class="eicon">📝</div>No notes yet.<br>Tap + to create your first encrypted note.</div>`;
    return;
  }
  el.innerHTML = ids.map(id => {
    const n = notes[id];
    const d = n.updatedAt ? new Date(n.updatedAt).toLocaleDateString(undefined,{month:'short',day:'numeric'}) : '';
    const preview = (n.content||'').replace(/\n/g,' ').slice(0,55) || 'Empty note';
    return `<div class="note-card" onclick="selectNote('${id}')">
      <div class="note-card-title">${escHtml(n.title||'Untitled')}</div>
      <div class="note-card-preview">${escHtml(preview)}</div>
      <div class="note-card-meta">
        <span class="note-card-date">${d}</span>
        <span class="enc-tag">AES-256</span>
      </div>
    </div>`;
  }).join('');
}

function newNote() {
  const id = uid();
  notes[id] = { title:'', content:'', updatedAt:Date.now() };
  currentNoteId = id;
  openEditor(id);
}

function selectNote(id) { currentNoteId = id; openEditor(id); }

function openEditor(id) {
  const n = notes[id];
  document.getElementById('note-title').value   = n.title   || '';
  document.getElementById('note-content').value = n.content || '';
  showScreen('screen-editor');
  setTimeout(() => {
    const el = !n.title
      ? document.getElementById('note-title')
      : document.getElementById('note-content');
    el.focus();
    if (!n.title && el.tagName==='TEXTAREA') el.setSelectionRange(el.value.length, el.value.length);
  }, 80);
}

function goBack() { renderNotesList(); showScreen('screen-list'); }

async function saveNote() {
  if (!currentNoteId) return;
  notes[currentNoteId] = {
    title:     document.getElementById('note-title').value   || 'Untitled',
    content:   document.getElementById('note-content').value,
    updatedAt: Date.now()
  };
  await persist();
  renderNotesList();
  showToast('✅ Saved & encrypted');
}

async function deleteNote() {
  if (!currentNoteId) return;
  if (!confirm('Delete this note? Cannot be undone.')) return;
  delete notes[currentNoteId];
  currentNoteId = null;
  await persist();
  goBack();
  showToast('🗑 Note deleted');
}

// ══════════════════════════════════════
//  UTILS
// ══════════════════════════════════════
function showErr(el, msg) { el.textContent = msg; el.style.display = 'block'; }
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
let toastT;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('show'), 2200);
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key==='s') { e.preventDefault(); saveNote(); }
  if (e.key==='Escape' && !document.getElementById('screen-editor').classList.contains('hidden')) goBack();
});
document.getElementById('unlock-password').addEventListener('keydown', e => {
  if (e.key==='Enter') unlockVault();
});

// Init
if (!localStorage.getItem(SALT_KEY)) {
  // No vault yet — show only the create form, no tabs
  document.getElementById('tab-unlock').style.display = 'none';
  document.getElementById('tab-new').style.display = '';
  document.getElementById('tab-btn-new').classList.add('active');
  document.getElementById('tab-btn-unlock').classList.remove('active');
} else {
  // Vault exists — show only unlock, no tabs
  document.getElementById('tab-unlock').style.display = '';
  document.getElementById('tab-new').style.display = 'none';
}
</script>
</body>
</html>
